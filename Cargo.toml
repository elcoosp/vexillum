[workspace]
resolver = "3"
members = [
    "crates/*",
    "apps/api",
    "apps/worker",
]
exclude = ["scripts/wasm-spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/vexillum"

[workspace.dependencies]
vexillum-core = { path = "crates/core" }
vexillum-templates = { path = "crates/templates" }
vexillum-render = { path = "crates/render" }
vexillum-data = { path = "crates/data" }
vexillum-cache = { path = "crates/cache" }
vexillum-theme = { path = "crates/theme" }
vexillum-icons = { path = "crates/icons" }
vexillum-auth = { path = "crates/auth" }
vexillum-billing = { path = "crates/billing" }
vexillum-api = { path = "crates/api" }
takumi = "2.18.2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
async-trait = "0.1"
sea-orm = { version = "2.0.4", default-features = false, features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-json",
    "with-time",
] }
moka = { version = "0.12", features = ["future"] }
redb = "4"
tempfile = "3"
wiremock = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
incremental = false
