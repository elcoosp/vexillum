[package]
name = "vexillum-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vexillum-api = { workspace = true }
vexillum-core = { workspace = true }
vexillum-templates = { workspace = true }
vexillum-render = { workspace = true }
vexillum-theme = { workspace = true }
vexillum-icons = { workspace = true }
vexillum-data = { workspace = true }
vexillum-cache = { workspace = true }
vexillum-auth = { workspace = true }
vexillum-billing = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tower = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
