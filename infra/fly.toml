app = "vexillum"
primary_region = "fra"

[build]
  dockerfile = "../Dockerfile"

[env]
  VX_LISTEN = "0.0.0.0:8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 256

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
